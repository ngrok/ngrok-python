on:
  workflow_call:
    inputs:
      docker:
        required: false
        type: string
      host:
        required: true
        type: string
      if:
        description: 'Whether to run this job'
        required: false
        default: true
        type: boolean
      publish:
        required: false
        type: boolean
        default: false
      setup:
        required: false
        type: string
      target:
        required: true
        type: string
jobs:
  reusable-build:
    if: ${{ inputs.if }}
    name: stable - ${{ inputs.target }} - python@3.12
    runs-on: ${{ inputs.host }}
    env:
      PYTHON_VERSION: "3.12"
      MATURIN_VERSION: "v1.9.1"
      XWIN_VERSION: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ inputs.target }}-cargo-${{ inputs.host }}
      # The cache restores target/, which can hold wheels from an older
      # version. Remove them so the artifact holds only this build's wheel.
      - name: Remove cached wheels
        run: rm -rf target/wheels
        shell: bash
      - name: Setup toolchain
        run: ${{ inputs.setup }}
        if: ${{ inputs.setup }}
        shell: bash
      - name: Install nasm for i686-pc-windows-msvc
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: inputs.target == 'i686-pc-windows-msvc'
      - name: Setup x86 Python for i686-pc-windows-msvc
        if: ${{ inputs.target == 'i686-pc-windows-msvc' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: "x86"
      - name: Download ARM64 Python SDK
        if: ${{ inputs.target == 'aarch64-pc-windows-msvc' }}
        run: |
          curl -LO https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}.0/python-${{ env.PYTHON_VERSION }}.0-embed-arm64.zip
          mkdir python-arm64
          tar -xf python-${{ env.PYTHON_VERSION }}.0-embed-arm64.zip -C python-arm64
      - name: Set ARM64 Python environment variables 
        if: ${{ inputs.target == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          echo "PYTHONHOME=${{ github.workspace }}\python-arm64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PYTHONPATH=${{ github.workspace }}\python-arm64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PATH=${{ github.workspace }}\python-arm64;${env:PATH}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build musl for ${{ inputs.target }}
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        if: ${{ inputs.target == 'x86_64-unknown-linux-musl' || inputs.target == 'aarch64-unknown-linux-musl' }}
        with:
          image: ${{ inputs.docker }}
          options: '-e SHOULD_PUBLISH=${{ inputs.publish }} --user 0:0 -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index -v ${{ github.workspace }}:/build -w /build'
          run: |
            echo "apk add:"
            apk upgrade
            apk add musl-dev gcc make cmake clang-libclang rustup python3-dev bash
            rustup-init -y
            . $HOME/.cargo/env

            echo "create venv:"
            make venv
            ./venv/bin/pip install patchelf
            make build

            if [ "${SHOULD_PUBLISH}" == 'true' ]; then
              echo "~~~~ maturin building release wheel"
              . ./venv/bin/activate && maturin build --release --strip
            fi

      - name: Build aarch64-unknown-linux-gnu
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        if: ${{ inputs.target == 'aarch64-unknown-linux-gnu' }}
        with:
          image: ${{ inputs.docker }}
          options: '-e SHOULD_PUBLISH=${{ inputs.publish }} --user 0:0 -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index -v ${{ github.workspace }}:/build -w /build'
          run: |
            # Ensure multilib support is available
            sudo apt -y update
            sudo apt -y full-upgrade
            sudo apt -y install gcc-multilib

            # Install Rust
            curl --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"

            # ring 0.17 assembly build needs __ARM_ARCH set; -DAT_HWCAP2=26
            # works around aws-lc-sys 0.41 vs. the manylinux2014 sysroot (see commit msg)
            export CFLAGS_aarch64_unknown_linux_gnu="-D__ARM_ARCH=8 -DAT_HWCAP2=26"
            rustup component add llvm-tools-preview || true
            rustup target add aarch64-unknown-linux-gnu
            python3 -m venv .env
            . .env/bin/activate && pip install -r requirements.txt
            . .env/bin/activate && pip install patchelf
            # Build without '--release': optimization breaks TLS signature
            # validation on this platform. The publish job uploads this wheel.
            echo "~~~~ maturin building"
            . .env/bin/activate && maturin build --strip --target ${{ inputs.target }}
      - name: Build armv7-unknown-linux-gnueabihf
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        if: ${{ inputs.target == 'armv7-unknown-linux-gnueabihf' }}
        with:
          image: ${{ inputs.docker }}
          options: '-e SHOULD_PUBLISH=${{ inputs.publish }} --user 0:0 -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index -v ${{ github.workspace }}:/build -w /build'
          run: |
            # Ensure multilib support is available
            sudo apt -y update
            sudo apt -y full-upgrade
            sudo apt -y install gcc-multilib

            # Set up bindgen environment
            export BINDGEN_EXTRA_CLANG_ARGS="--target=armv7-unknown-linux-gnueabihf"
            export BINDGEN_SYSROOT="/usr/arm-linux-gnueabihf"
            export RUST_BACKTRACE=1
            
            # Install Rust and configure ARM target
            curl --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup target add armv7-unknown-linux-gnueabihf
            cargo install --force --locked bindgen-cli

            python3 -m venv .env
            . .env/bin/activate && pip install -r requirements.txt
            . .env/bin/activate && pip install patchelf
            # Build without '--release': optimization breaks TLS signature
            # validation on this platform. The publish job uploads this wheel.
            echo "~~~~ maturin building"
            . .env/bin/activate && maturin build --strip --target ${{ inputs.target }} --verbose
      - name: Build x86_64-unknown-linux-gnu
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        if: ${{ inputs.target == 'x86_64-unknown-linux-gnu' }}
        with:
          image: ${{ inputs.docker }}
          options: '-e SHOULD_PUBLISH=${{ inputs.publish }} --user 0:0 -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index -v ${{ github.workspace }}:/build -w /build'
          run: |
            # Update and install required packages
            sudo apt-get update
            sudo apt-get install -y llvm-dev clang libclang-dev gcc-multilib

            # Install Rust minimal toolchain
            curl --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"

            # Add necessary Rust targets and components
            rustup component add llvm-tools-preview || true
            rustup target add x86_64-unknown-linux-gnu

            # Create and activate Python virtual environment
            python3 -m venv .env
            . .env/bin/activate && pip install -r requirements.txt
            . .env/bin/activate && pip install patchelf

            # this is in raw 'sh', use single '='
            if [ "${SHOULD_PUBLISH}" = 'true' ]; then
              echo "~~~~ maturin building release wheel"
              . .env/bin/activate && maturin build --release --strip --target ${{ inputs.target }} -i python3.12
            else
              echo "~~~~ maturin building"
              . .env/bin/activate && maturin build --target ${{ inputs.target }}
            fi
      - name: Build Python Extension Module (non-docker)
        if: ${{ !inputs.docker && !contains(inputs.target,'android') }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ inputs.target }}
          args: --release --strip -i python${{ env.PYTHON_VERSION }} --target ${{ inputs.target }} -m Cargo.toml
        env:
          XWIN_VERSION: ${{ env.XWIN_VERSION }}
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ inputs.target }}
          path: target/wheels/*.whl # path to the python wheel package
          if-no-files-found: error
