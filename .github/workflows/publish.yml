name: Publish All
on:
  workflow_dispatch:

jobs:
  ci:
    name: Run CI
    uses: ./.github/workflows/ci.yml
    secrets:
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
    permissions:
      contents: write
    with:
      publish: true
  pypi-publish:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    # PyPI trusts this workflow and environment, and issues a short-lived
    # upload token through OIDC. No API token is stored in the repository.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bindings-*
          path: dist
          merge-multiple: true
      - name: Check wheels
        run: |
          # PyPI does not accept FreeBSD wheels.
          rm -f dist/*freebsd*
          version="$(grep '^version =' Cargo.toml | head -n1 | awk -F\" '{print $2}')"
          ls -l dist
          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in
              "ngrok-${version}-"*) ;;
              *) echo "::error::$wheel is not version ${version}"; exit 1 ;;
            esac
          done
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
  tag-release:
    name: Tag Release
    needs: pypi-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jrobsonchase/direnv-action@57d5101f123f9106acdd8797515c262b565ec7a5 # v0.7
      - name: Tag Release
        run: |
          version="$(grep '^version =' Cargo.toml | head -n1 | awk -F\" '{print $2}')"
          tag="v${version}"
          git config user.name "GitHub Action"
          git config user.email noreply@ngrok.com
          echo "Version: ${version} tag: $tag"
          echo "Fetching all tags in the repository"
          git fetch --tags
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping tag creation."
          else
            echo "Tag $tag does not exist, pushing tag."
            git tag -a -m "Version ${version}" $tag
            git push --tags
          fi
